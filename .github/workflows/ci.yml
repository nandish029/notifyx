name: NotifyX CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build SDK
      run: npm run build

    - name: Run Unit Tests with Coverage (Jest)
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        fail_ci_if_error: false

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Integration Tests (Playwright)
      run: npm run test:integration

    - name: Verify Vite Vanilla Build
      run: |
        cd tests/frameworks/package-test
        npm install
        npm install ../../../
        npm run build

    - name: Verify React Build
      run: |
        cd tests/frameworks/react-test
        npm install
        npm install ../../../
        npm run build

    - name: Verify Next.js Build
      run: |
        cd tests/frameworks/next-test
        npm install
        npm install ../../../
        npm run build
